<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet de déplacement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Mise en page : barre latérale marine avec la liste des voyages, zone de travail claire à droite.
   Sur téléphone, la barre passe en haut et les voyages défilent horizontalement. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#f4f6f9; --ink:#121a2b; --muted:#5e6a7d; --line:#dde2ea;
  --side:#0f1b33; --side-ink:#e8edf7; --side-muted:#8e9bb5; --side-hi:#1c2b4d;
  --accent:#2f63f0; --accent-ink:#ffffff; --accent-soft:#e3eaff;
  --ok:#1f8a54; --ok-soft:#ddf2e6; --warn:#a86a12; --warn-soft:#fbefd6; --bad:#d23a3a; --bad-soft:#fbe1e1;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --surface:#131b2e; --sunk:#19223a; --ink:#e6ebf5; --muted:#93a0b8; --line:#26314a;
  --side:#070c18; --side-hi:#16213a; --accent:#6e93ff; --accent-ink:#0b1120; --accent-soft:#1c2a52;
  --ok:#4cc487; --ok-soft:#12301f; --warn:#e3a94a; --warn-soft:#33270f; --bad:#f06a6a; --bad-soft:#3a1717; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#131b2e; --sunk:#19223a; --ink:#e6ebf5; --muted:#93a0b8; --line:#26314a;
  --side:#070c18; --side-hi:#16213a; --accent:#6e93ff; --accent-ink:#0b1120; --accent-soft:#1c2a52;
  --ok:#4cc487; --ok-soft:#12301f; --warn:#e3a94a; --warn-soft:#33270f; --bad:#f06a6a; --bad-soft:#3a1717; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-display);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-stretch:112%;text-wrap:balance;line-height:1.1}
.mono{font-family:var(--f-mono)}

/* Structure */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:20px 14px}
.content{min-width:0;padding-inline:clamp(16px,4vw,40px);padding-block:28px 64px;display:flex;flex-direction:column;gap:22px;max-width:1180px;width:100%}

/* Barre latérale */
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 14px}
.logo{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;flex:none}
.brand b{display:block;font-stretch:118%;font-size:16px;line-height:1.1}
.brand span{font-size:12px;color:var(--side-muted)}
.label{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-muted);padding:8px 8px 2px}
.triplist{display:flex;flex-direction:column;gap:2px}
.tripitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--side-ink);width:100%}
.tripitem:hover{background:var(--side-hi)}
.tripitem.on{background:var(--side-hi);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.tripitem.done{opacity:.55}
.ti-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-meta{grid-column:1;font-size:12px;color:var(--side-muted)}
.ti-side{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-family:var(--f-mono);font-size:12px;color:var(--side-muted)}
.ti-al{background:var(--bad);color:#fff;border-radius:999px;min-width:20px;padding:0 6px;text-align:center;font-weight:600}
.side-row{display:flex;flex-direction:column;gap:6px;margin-top:6px;flex:1}
.newtrip{background:none;border:1px dashed rgba(255,255,255,.25);color:var(--side-ink);border-radius:8px;padding:9px;cursor:pointer}
.newtrip:hover{border-color:var(--side-ink)}
.syncbox{margin-top:auto;display:flex;gap:10px;align-items:center;background:var(--side-hi);border:0;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--side-ink);font-size:13px;text-align:left}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted);display:inline-block}
.dot.ok{background:var(--ok)} .dot.saving,.dot.pending{background:var(--warn)} .dot.error,.dot.cle,.dot.script{background:var(--bad)}

/* En-tête du voyage */
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
h1{font-size:clamp(30px,4.5vw,46px);font-weight:800;font-stretch:120%;margin-top:4px}
.meta{color:var(--muted);margin:6px 0 0}
.cd{text-align:right}
.cd b{display:block;font-family:var(--f-mono);font-size:clamp(34px,5vw,52px);font-weight:600;line-height:1;color:var(--accent);letter-spacing:-.02em}
.cd span{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--f-mono);font-size:11px;font-weight:500;background:var(--sunk);border-radius:999px;padding:1px 6px;margin-left:6px;color:var(--muted)}

/* Boutons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}

/* Blocs */
.bar-h{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.bar-h>div:first-child{margin-right:auto;min-width:0}
.bar-h .actions{margin:0}
h2{font-size:24px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel.flush{padding:0}
.panel h3{font-size:18px;margin-bottom:10px}
.panel.flush h3{padding:18px 18px 0}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{padding:14px 16px;min-width:0;box-shadow:1px 1px 0 var(--line)}
.stat .k{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .v{font-size:32px;font-weight:700;font-stretch:115%;line-height:1.15}
.stat .v small{font-size:16px;color:var(--muted);font-weight:500}
.stat .d{font-size:13px;color:var(--muted)}
.v.bad{color:var(--bad)} .v.good{color:var(--ok)}
.notice{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap;border-radius:10px;padding:12px 14px;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.notice p{margin:0;flex:1;min-width:220px}
.notice.bad{background:var(--bad-soft);border-color:transparent}
.notice.warn{background:var(--warn-soft);border-color:transparent}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.empty .actions{justify-content:center}

/* Pastilles d'état */
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.tog{border:0;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.tog.on{background:var(--ok-soft);color:var(--ok)} .tog.off{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.miss{color:var(--bad);font-size:13px}
.small{font-size:13px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:11px;background:var(--sunk);color:var(--muted);border-radius:4px;padding:1px 6px;margin-left:6px}

/* Points à régler */
.alerts{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:start;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;text-align:left;cursor:pointer;width:100%}
.al:first-child{border-top:0}
.al:hover b{color:var(--accent)}
.al b{display:block;font-weight:600}
.al small{display:block;color:var(--muted);font-size:13px}
.al .go{color:var(--muted)}
.al .pill{justify-self:start;margin-top:2px}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14px;margin:0}
.info dt{color:var(--muted)} .info dd{margin:0;font-weight:600;text-align:right}

/* Tableaux */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
.panel table{min-width:520px}
th{font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
.num{text-align:right}
.name{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:left}
.name:hover{color:var(--accent);text-decoration:underline}

/* Répartition voitures / chambres */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.slot.over{border-color:var(--bad)}
.slot-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.slot-h h3{font-size:18px}
.gauge{display:flex;gap:3px;flex-wrap:wrap}
.gauge i{width:14px;height:14px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.gauge i.f{background:var(--accent);border-color:var(--accent)}
.gauge i.x{background:var(--bad);border-color:var(--bad)}
.occ{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px}
.kid{display:inline-flex;align-items:center;gap:2px;background:var(--sunk);border-radius:999px;padding:3px 4px 3px 11px;font-size:13px}
.kid.adult{background:none;border:1px dashed var(--line);padding-right:11px}
.kid button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 5px}
.kid button:hover{color:var(--bad)}
select.assign{border:1px dashed var(--line);background:none;border-radius:8px;padding:6px 8px;font-size:13px;color:var(--muted);max-width:100%}

/* Budget */
.cat{display:grid;grid-template-columns:130px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.cat .b{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.cat .b i{display:block;height:100%;background:var(--accent);border-radius:5px}
.auto{color:var(--muted);font-style:italic}

/* Tâches */
.task{display:flex;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{flex:1;min-width:0}
.late{color:var(--bad);font-weight:600}

/* Fenêtres */
.ov{position:fixed;inset:0;background:rgba(8,14,28,.55);display:flex;justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto;z-index:20}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:580px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet h2{font-size:20px}
.x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px}
.fd{display:flex;flex-direction:column;gap:4px;grid-column:span 2;min-width:0}
.fd.half{grid-column:span 1}
.fd label{font-size:13px;font-weight:600;color:var(--muted)}
.fd input:not([type=checkbox]),.fd select,.fd textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);width:100%}
.fd textarea{min-height:68px;resize:vertical}
.fd.chk{flex-direction:row;align-items:center;gap:10px}
.fd.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.fd.chk label{color:var(--ink);font-weight:500;font-size:14px}
.fd p{margin:0}
.hint{font-size:12px;color:var(--muted)}
.sheet footer{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.sp{flex:1}
.err{color:var(--bad);font-size:13px;margin:0;padding:0 18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:14px 16px 12px}
  .brand{padding-bottom:6px}
  .triplist{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .tripitem{flex:0 0 220px}
  .side-row{flex-direction:row}
  .side-row>*{flex:1;margin-top:0}
  .cols{grid-template-columns:1fr}
}
@media (max-width:480px){ .fd.half{grid-column:span 2} .al{grid-template-columns:minmax(0,1fr) auto} .al .pill{grid-column:1/-1} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .16s ease-out} @keyframes up{from{transform:translateY(8px);opacity:.6}} }
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <div class="content" id="main"></div>
</div>
<div class="ov" id="ov" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== Google Sheets ===== */
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbyxylh_7dn1jSv4aCyW-s7Ut5IQdLuNXIfJZdgf2GXiDMdDElckUfV6bXM09hKhLyrgEA/exec';
const CLE = '0501';
const DATA_KEY = 'carnet-deplacement-donnees';

/* ===== Outils ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const EUR = new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR', maximumFractionDigits:0});
const eur = n => EUR.format(n || 0);
const today = () => new Date().toISOString().slice(0, 10);
const fdate = d => { if (!d) return ''; const x = new Date(d + 'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'}); };
const daysTo = d => d ? Math.round((new Date(d + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5) : null;
const full = p => p ? [p.prenom, p.nom].filter(Boolean).join(' ') || 'Sans nom' : '';
const byName = (a, b) => (a.nom || '').localeCompare(b.nom || '', 'fr') || (a.prenom || '').localeCompare(b.prenom || '', 'fr');
const newId = () => 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const strip = o => { const {id, ...r} = o || {}; return r; };

/* ===== Listes ===== */
const COLS = ['enfants','parents','hebergements','vehicules','budget','taches'];
const STATUTS = ['En préparation','Confirmé','Terminé','Annulé'];
const CATS = ['U7','U9','U11','U13','U15','U17','U19','Seniors','Autre'];
const TABS = [['apercu','Vue d’ensemble'],['enfants','Enfants'],['parents','Parents'],['hebergement','Hébergement'],['transport','Transport'],['budget','Budget'],['taches','À faire']];
const TEMPLATE = ['Réserver l’hébergement','Confirmer l’inscription au tournoi','Envoyer le courrier d’information aux familles','Collecter les autorisations parentales','Collecter les fiches sanitaires','Vérifier licences et pièces d’identité','Vérifier l’assurance du club pour le déplacement','Trouver les conducteurs et répartir les véhicules','Vérifier permis et assurance des conducteurs','Encaisser les participations','Prévoir repas et pique-nique du trajet','Préparer la trousse de secours','Préparer maillots, ballons, chasubles et plots','Envoyer la répartition voitures et chambres aux parents','Créer un groupe de messagerie avec les parents'];

/* ===== État : ALL = tous les voyages, S = le voyage ouvert ===== */
let ALL = {voyages:[], actif:''}, S = null, tab = 'apercu';
let dirty = false, rev = 0, sync = 'pending', lastSync = null, timer = 0, scriptV = 0;
try { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) tab = h; } catch(e) {}

const blankTrip = trip => { const v = {id:newId(), trip:trip || {}}; COLS.forEach(c => v[c] = []); return v; };
function ensure(){
  if (!ALL.voyages.length) ALL.voyages.push(blankTrip());
  ALL.voyages.forEach(v => { v.trip = v.trip || {}; COLS.forEach(c => v[c] = v[c] || []); });
  S = ALL.voyages.find(v => v.id === ALL.actif) || ALL.voyages[0];
  ALL.actif = S.id;
}
try {
  const saved = JSON.parse(localStorage.getItem(DATA_KEY) || 'null');
  if (saved && saved.ALL) { ALL = saved.ALL; dirty = !!saved.dirty; }
  else if (saved && saved.S) { ALL = {voyages:[{id:'v1', ...saved.S}], actif:'v1'}; dirty = !!saved.dirty; } /* première version, un seul voyage */
} catch(e) {}
ensure();

function saveLocal(){ try { localStorage.setItem(DATA_KEY, JSON.stringify({ALL, dirty})); } catch(e) {} }
function changed(){
  dirty = true; rev++; saveLocal();
  sync = 'pending'; clearTimeout(timer); timer = setTimeout(push, 1500);
  render();
}
function put(col, id, data){
  const arr = S[col];
  if (id) { const i = arr.findIndex(x => x.id === id); if (i > -1) arr[i] = {id, ...data}; }
  else arr.push({id:newId(), ...data});
  changed();
}
const del = (col, id) => { S[col] = S[col].filter(x => x.id !== id); changed(); };
const patch = (col, item, ch) => put(col, item.id, {...strip(item), ...ch});
const find = (col, id) => S[col].find(x => x.id === id);

/* Les valeurs lues dans Sheets sont du texte : on remet cases à cocher et nombres au bon type */
function normRow(r, fields){
  const o = {};
  for (const f of fields) {
    const v = r[f.k];
    o[f.k] = f.t === 'check' ? (v === true || /^(oui|true|vrai|1|x)$/i.test(String(v ?? '').trim()))
           : f.t === 'number' ? (v === '' || v == null ? '' : num(v))
           : (v == null ? '' : String(v));
  }
  return o;
}
/* Sheets : un onglet « voyages » + une colonne « voyage » dans chaque autre onglet */
function fromSheets(d){
  let vs = Array.isArray(d.voyages)
    ? d.voyages.filter(v => v.id).map(v => ({id:String(v.id), trip:{...normRow(v, F.trip.fields), lien:String(v.lien || '')}}))
    : [{id:'v1', trip:normRow(d.trip || {}, F.trip.fields)}];
  if (!vs.length) vs = [{id:'v1', trip:{}}];
  vs.forEach(v => COLS.forEach(c => v[c] = []));
  const map = Object.fromEntries(vs.map(v => [v.id, v]));
  for (const c of COLS) for (const r of (d[c] || [])) {
    if (r.id) (map[String(r.voyage || '')] || vs[0])[c].push({id:String(r.id), ...normRow(r, F[c].fields)});
  }
  ALL.voyages = vs; ensure();
}
function wire(){
  const body = {voyages: ALL.voyages.map(v => ({id:v.id, ...v.trip}))};
  COLS.forEach(c => body[c] = ALL.voyages.flatMap(v => v[c].map(x => ({voyage:v.id, ...x}))));
  return body;
}
async function getSheets(){
  const j = await (await fetch(SHEETS_URL + '?cle=' + encodeURIComponent(CLE))).json();
  if (!j.ok) throw new Error(j.erreur || 'serveur');
  scriptV = j.version || 1;
  return j;
}
async function push(){
  clearTimeout(timer);
  const sent = rev; sync = 'saving'; render();
  try {
    if (scriptV < 2) await getSheets();
    if (scriptV < 2) { sync = 'script'; return render(); }  /* l'ancien script mélangerait les voyages */
    const j = await (await fetch(SHEETS_URL, {method:'POST', body:JSON.stringify({cle:CLE, ...wire()})})).json();
    if (!j.ok) throw new Error(j.erreur || 'serveur');
    if (rev === sent) dirty = false;
    lastSync = new Date(); sync = dirty ? 'pending' : 'ok'; saveLocal();
    if (dirty) timer = setTimeout(push, 1500);
  } catch(e) { sync = e.message === 'cle' ? 'cle' : 'error'; }
  render();
  if ($('#ov [data-act="rmlien"]')) openLien();
}
async function pull(){
  sync = 'saving'; render();
  try {
    const j = await getSheets();
    const vide = !(j.voyages || []).length && !(j.trip || {}).nom && COLS.every(c => !(j[c] || []).length);
    const localVide = !ALL.voyages.some(v => v.trip.nom || COLS.some(c => v[c].length));
    if (vide && !localVide) return push();
    fromSheets(j); dirty = false; lastSync = new Date(); saveLocal();
    sync = scriptV < 2 ? 'script' : 'ok';
  } catch(e) { sync = e.message === 'cle' ? 'cle' : 'error'; }
  render();
}
function syncLabel(){
  const h = lastSync ? ' à ' + lastSync.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : '';
  return {pending:'Modifications en attente…', saving:'Enregistrement…', ok:'Enregistré dans Google Sheets' + h,
    error:'Google Sheets injoignable', cle:'Clé refusée par Google Sheets', script:'Script Google à mettre à jour'}[sync];
}

/* ===== Calculs ===== */
function calc(T){
  const kids = [...T.enfants].sort(byName);
  const heb = id => T.hebergements.find(h => h.id === id);
  const veh = id => T.vehicules.find(v => v.id === id);
  const part = num(T.trip.participation);
  const dep = T.budget.filter(b => b.sens !== 'Recette'), rec = T.budget.filter(b => b.sens === 'Recette');
  const depHeb = sum(T.hebergements, h => num(h.cout)), depVeh = sum(T.vehicules, v => num(v.cout));
  const attendu = part * kids.length;
  const depenses = sum(dep, b => num(b.montant)) + depHeb + depVeh;
  const recettes = sum(rec, b => num(b.montant)) + attendu;
  return {
    kids, heb, veh, part, dep, depHeb, depVeh, attendu, depenses, recettes, solde: recettes - depenses,
    par: id => T.parents.find(p => p.id === id),
    noHeb: kids.filter(k => !heb(k.hebergement)),
    noVeh: kids.filter(k => !veh(k.vehicule)),
    accomp: T.parents.filter(p => p.accompagne),
    places: sum(T.vehicules, v => num(v.places)),
    lits: sum(T.hebergements, h => num(h.capacite)),
    encaisse: sum(kids, k => num(k.paye)),
    hebOcc: h => kids.filter(k => k.hebergement === h.id).length + T.parents.filter(p => p.hebergement === h.id).length,
    vehOcc: v => kids.filter(k => k.vehicule === v.id).length,
    lateTasks: T.taches.filter(t => !t.fait && t.echeance && t.echeance < today())
  };
}
function alertsFor(T, c){
  const a = [], n = c.kids.length;
  const names = l => l.slice(0, 4).map(full).join(', ') + (l.length > 4 ? ` et ${l.length - 4} autre(s)` : '');
  if (c.noVeh.length) a.push(['bad', `${c.noVeh.length} enfant(s) sans transport`, names(c.noVeh), 'transport']);
  if (n && !T.hebergements.length) a.push(['bad', 'Aucun hébergement enregistré', 'Ajoutez le lieu où dort le groupe.', 'hebergement']);
  else if (c.noHeb.length) a.push(['bad', `${c.noHeb.length} enfant(s) sans hébergement`, names(c.noHeb), 'hebergement']);
  T.vehicules.forEach(v => { const o = c.vehOcc(v), p = num(v.places); if (o > p) a.push(['bad', `${v.nom} : ${o - p} enfant(s) de trop`, `${o} enfants pour ${p} places`, 'transport']); });
  T.hebergements.forEach(h => { const o = c.hebOcc(h), p = num(h.capacite); if (p && o > p) a.push(['bad', `${h.nom} est complet`, `${o} personnes pour ${p} places`, 'hebergement']); });
  if (c.solde < 0) a.push(['bad', `Budget en déficit de ${eur(-c.solde)}`, 'Ajoutez une recette ou augmentez la participation.', 'budget']);
  for (const [k, l] of [['autorisation', 'autorisation(s) parentale(s) manquante(s)'], ['fiche', 'fiche(s) sanitaire(s) manquante(s)'], ['licence', 'licence(s) ou pièce(s) d’identité à vérifier']]) {
    const m = c.kids.filter(x => !x[k]); if (m.length) a.push(['warn', `${m.length} ${l}`, names(m), 'enfants']);
  }
  if (c.part) { const r = c.kids.filter(k => num(k.paye) < c.part); if (r.length) a.push(['warn', `${r.length} famille(s) n’ont pas tout payé`, `Reste à encaisser : ${eur(c.attendu - c.encaisse)}`, 'enfants']); }
  if (c.lateTasks.length) a.push(['warn', `${c.lateTasks.length} tâche(s) en retard`, c.lateTasks.slice(0, 3).map(t => t.tache).join(', '), 'taches']);
  if (n && !c.accomp.length) a.push(['warn', 'Aucun adulte accompagnateur', 'Indiquez quels parents accompagnent le groupe.', 'parents']);
  return a;
}

function fieldHtml(f, d){
  const id = 'f_' + f.k, v = d[f.k];
  if (f.t === 'check') return `<div class="fd chk"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}><label for="${id}">${esc(f.l)}</label></div>`;
  let inp;
  if (f.t === 'select') {
    const opts = f.o().map(o => typeof o === 'string' ? {v:o, l:o} : o);
    inp = `<select id="${id}">${f.noEmpty ? '' : '<option value="">—</option>'}${opts.map(o => `<option value="${esc(o.v)}" ${o.v === v ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
  } else if (f.t === 'textarea') inp = `<textarea id="${id}">${esc(v)}</textarea>`;
  else inp = `<input id="${id}" type="${f.t === 'number' ? 'text' : (f.t || 'text')}" ${f.t === 'number' ? 'inputmode="decimal"' : ''} value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
  return `<div class="fd ${f.half ? 'half' : ''}"><label for="${id}">${esc(f.l)}${f.req ? ' *' : ''}</label>${inp}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
}

    <header><h2>${title}</h2><button type="button" class="x" data-close aria-label="Fermer">×</button></header>
    <div class="fg">${body}</div><p class="err" id="ferr" hidden></p><footer>${foot}</footer></${tag}>`;

  const first = $('#ov').querySelector('input:not([readonly]):not([type=file]),select,textarea:not([readonly])'); if (first) first.focus();

/* ===== Liste d'enfants collée d'un coup ===== */
function parseListe(txt){
  const cap = s => s.toLowerCase().replace(/(^|[\s'-])\p{L}/gu, m => m.toUpperCase());
  const isUp = s => /\p{L}/u.test(s) && s === s.toUpperCase();
  const out = [];
  for (let line of txt.split(/\r?\n/)) {
    line = line.replace(/^\s*(\d+[.)-]?|[-•*])\s+/, '').trim();
    if (!line) continue;
    let prenom, nom, categorie = '';
    const parts = line.split(/\t|;|,/).map(s => s.trim()).filter(Boolean);
    if (parts.length >= 2) {
      [prenom, nom] = parts;
      categorie = CATS.find(c => parts.slice(2).some(p => p.toLowerCase() === c.toLowerCase())) || '';
      if (isUp(prenom) && !isUp(nom)) [prenom, nom] = [nom, prenom];
    } else {
      const w = line.split(/\s+/), up = w.filter(isUp);
      if (up.length && up.length < w.length) { nom = up.join(' '); prenom = w.filter(x => !isUp(x)).join(' '); }
      else { prenom = w[0]; nom = w.slice(1).join(' '); }
    }
    out.push({prenom:cap(prenom), nom:nom.toUpperCase(), categorie});
  }
  return out;
}

    <div class="fd half"><label>Aperçu</label><span id="b_prev" style="padding-top:8px">Aucun nom saisi</span></div>`,
    `<span class="sp"></span><button type="button" class="btn" data-close>Annuler</button><button class="btn primary" type="submit" id="b_ok" disabled>Ajouter</button>`, 'bulk');
  const key = k => (k.prenom + '|' + k.nom).toLowerCase();
  const compute = () => {
    const seen = new Set(S.enfants.map(key)), list = parseListe($('#b_txt').value);
    const fresh = list.filter(k => !seen.has(key(k)) && seen.add(key(k)));
    const dup = list.length - fresh.length;
    $('#b_prev').textContent = list.length ? `${fresh.length} enfant(s) à ajouter${dup ? ` · ${dup} doublon(s) ignoré(s)` : ''}` : 'Aucun nom saisi';
    $('#b_ok').disabled = !fresh.length;
    $('#b_ok').textContent = fresh.length ? `Ajouter ${fresh.length} enfant(s)` : 'Ajouter';
    return fresh;
  };
  $('#b_txt').oninput = compute;
  $('#bulk').onsubmit = e => {
    e.preventDefault();
    const fresh = compute(), cat = $('#b_cat').value;
    fresh.forEach(k => S.enfants.push({id:newId(), prenom:k.prenom, nom:k.nom, categorie:k.categorie || cat, naissance:'', parent:'',

  };
}

function jeton(){
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(18)), x => abc[x % abc.length]).join('');
}

  const t = S.trip, url = t.lien ? SHEETS_URL + '?p=' + t.lien : '';
  if (!t.lien) return modal('Lien parents', `
    <div class="fd"><p>Créez un lien à envoyer aux parents de <strong>${esc(tripName(S))}</strong>. Ils verront seulement ce voyage, sans pouvoir rien modifier ni voir vos autres voyages.</p></div>
    <div class="fd"><label>Ce que les parents voient</label><p class="small">Dates, rendez-vous, contact d’urgence, participation, voitures (avec nom et téléphone du conducteur), hébergement, accompagnateurs, liste des enfants (prénom et initiale).</p></div>
    <div class="fd"><label>Ce qu’ils ne voient jamais</label><p class="small">Infos santé, paiements, documents, budget, tâches, téléphones des autres parents.</p></div>`,
    `<span class="sp"></span><button class="btn" data-close>Annuler</button><button class="btn primary" data-act="mklien">Créer le lien</button>`);
  const msg = `Bonjour à tous, voici la page du déplacement « ${tripName(S)} »${t.depart ? ' (' + fdate(t.depart) + ')' : ''} : rendez-vous, voitures, hébergement. Elle est mise à jour au fur et à mesure.\n${url}`;
  modal('Lien parents', `
    <div class="fd"><label for="lienUrl">Lien de « ${esc(tripName(S))} »</label><input id="lienUrl" type="text" readonly value="${esc(url)}">
      ${sync === 'ok' ? '' : `<span class="hint" style="color:var(--bad)">Le lien marchera dès que l’enregistrement dans Google Sheets sera terminé (${esc(syncLabel())}).</span>`}</div>
    <div class="fd"><label for="lienMsg">Message prêt à envoyer</label><textarea id="lienMsg" readonly style="min-height:110px">${esc(msg)}</textarea></div>
    <div class="fd"><span class="hint">La page se met à jour toute seule. Si le lien circule trop, désactivez-le puis créez-en un nouveau.</span></div>`,
    `<button class="btn danger sm" data-act="rmlien">Désactiver ce lien</button><span class="sp"></span>
     <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Voir la page</a>
     <button class="btn" data-act="copy" data-txt="${esc(url)}">Copier le lien</button>
     <button class="btn primary" data-act="copy" data-txt="${esc(msg)}">Copier le message</button>`);
}

/* ===== Sauvegarde ===== */
function openSave(){
  modal('Sauvegarde', `
    <div class="fd"><p><span class="dot ${sync}" style="margin-right:8px"></span><strong>${esc(syncLabel())}</strong></p>
      <span class="hint">Chaque modification part dans votre Google Sheet environ une seconde après. Sans internet, elle reste gardée dans ce navigateur et partira au prochain enregistrement.</span></div>
    <div class="fd"><label>Copie de secours</label><p class="small">Un fichier à garder sur votre ordinateur.</p>
      <div class="actions" style="margin-top:4px"><button class="btn sm" data-act="export">Exporter une copie</button><label class="btn sm" for="imp">Importer une copie</label><input type="file" id="imp" accept=".json,application/json" hidden></div></div>`,
    `<button class="btn" data-act="pull">Recharger depuis Google Sheets</button><span class="sp"></span><button class="btn primary" data-act="push">Enregistrer maintenant</button>`);
  $('#imp').onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => { try { fromSheets(JSON.parse(rd.result)); closeForm(); changed(); toast('Copie importée.'); } catch(_) { formError('Ce fichier n’est pas une copie du carnet.'); } };
    rd.readAsText(file);
  };
}
function exportFile(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(wire(), null, 2)], {type:'application/json'}));
  a.download = 'carnet-deplacement-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ===== Copier ===== */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }
function copyOut(txt, ok){
  const fallback = () => modal('Texte à copier', `<div class="fd"><textarea id="cpy" style="min-height:260px">${esc(txt)}</textarea></div>`, `<span class="sp"></span><button class="btn primary" data-close>Fermer</button>`);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(ok), fallback);
  else fallback();
}
function repartition(what){
  const c = calc(S), t = S.trip, out = [`${tripName(S)}${t.depart ? ' – ' + fdate(t.depart) : ''}`];
  if (what === 'veh') {
    if (t.rdv) out.push(`Rendez-vous : ${t.rdv}`);
    S.vehicules.forEach(v => { const d = c.par(v.conducteur); out.push('', `🚗 ${v.nom}${d ? ' (' + full(d) + (d.telephone ? ', ' + d.telephone : '') + ')' : ''}${v.rdv ? ' – ' + v.rdv : ''}`, ...c.kids.filter(k => k.vehicule === v.id).map(k => '• ' + full(k))); });
    if (c.noVeh.length) out.push('', 'Sans place : ' + c.noVeh.map(full).join(', '));
  } else {
    S.hebergements.forEach(h => out.push('', `🏠 ${h.nom}${h.adresse ? ' – ' + h.adresse : ''}`, ...c.kids.filter(k => k.hebergement === h.id).map(k => '• ' + full(k)), ...S.parents.filter(p => p.hebergement === h.id).map(p => '• ' + full(p) + ' (adulte)')));
  }
  copyOut(out.join('\n'), 'Répartition copiée : collez-la dans le groupe des parents.');
}

/* ===== Affichage ===== */
let raf = 0;
function render(){ if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }
function draw(){
  const c = calc(S);
  $('#side').innerHTML = sidebar();
  const V = {enfants:vEnfants, parents:vParents, hebergement:vHeb, transport:vTransport, budget:vBudget, taches:vTaches}[tab] || vApercu;
  $('#main').innerHTML = header(c) + notice() + V(c);
}
const empty = (title, txt, btns) => `<div class="empty"><b>${title}</b>${txt}${btns ? `<div class="actions">${btns}</div>` : ''}</div>`;
const pageHead = (title, sub, btns) => `<div class="bar-h"><div><h2>${title}</h2><p class="sub">${sub}</p></div><div class="actions">${btns}</div></div>`;

function sidebar(){
  const vs = [...ALL.voyages].sort(tripOrder);
  return `<div class="brand"><span class="logo">CD</span><div><b>Carnet de déplacement</b><span>${vs.length} voyage(s)</span></div></div>
    <div class="label">Voyages</div>
    <div class="triplist">${vs.map(v => {
      const c = calc(v), urg = alertsFor(v, c).filter(a => a[0] === 'bad').length, d = daysTo(v.trip.depart);
      return `<button class="tripitem${v === S ? ' on' : ''}${isDone(v) ? ' done' : ''}" data-trip="${v.id}">
        <span class="ti-name">${esc(tripName(v))}</span>
        <span class="ti-meta">${v.trip.depart ? esc(fdate(v.trip.depart)) : 'Date à fixer'} · ${c.kids.length} enfant(s)</span>
        <span class="ti-side">${!isDone(v) && d !== null && d >= 0 ? `<span>${d ? 'J-' + d : 'Jour J'}</span>` : ''}${urg ? `<span class="ti-al" title="Points urgents">${urg}</span>` : ''}</span>
      </button>`;
    }).join('')}</div>
    <div class="side-row"><button class="newtrip" data-act="newtrip">+ Nouveau voyage</button>
    <button class="syncbox" data-act="save"><span class="dot ${sync}"></span><span>${esc(syncLabel())}</span></button></div>`;
}
function header(c){
  const t = S.trip, d = daysTo(t.depart);
  const counts = {enfants:c.kids.length, parents:S.parents.length, hebergement:S.hebergements.length, transport:S.vehicules.length, taches:S.taches.filter(x => !x.fait).length};
  return `<div class="hd"><div style="min-width:0">
      <div class="eyebrow">${esc([t.statut || 'En préparation', t.categorie].filter(Boolean).join(' · '))}</div>
      <h1>${esc(tripName(S))}</h1>
      <p class="meta">${[t.destination, t.depart && (fdate(t.depart) + (t.retour ? ' → ' + fdate(t.retour) : ''))].filter(Boolean).map(esc).join(' · ') || 'Destination et dates à renseigner'}</p>
      <div class="actions"><button class="btn sm" data-act="trip">Modifier le voyage</button><button class="btn sm" data-act="lien">${t.lien ? 'Lien parents · actif' : 'Lien parents'}</button></div></div>
    ${d !== null && !isDone(S) ? `<div class="cd"><b>${d > 0 ? 'J-' + d : d === 0 ? 'Jour J' : 'J+' + (-d)}</b><span>${d > 0 ? 'avant le départ' : d === 0 ? 'départ aujourd’hui' : 'depuis le départ'}</span></div>` : ''}
  </div>
  <nav class="tabs" role="tablist">${TABS.map(([id, l]) => `<button role="tab" data-tab="${id}" aria-selected="${tab === id}">${l}${counts[id] ? `<span class="n">${counts[id]}</span>` : ''}</button>`).join('')}</nav>`;
}
function notice(){
  if (sync === 'error') return `<div class="notice bad"><p><strong>Google Sheets ne répond pas.</strong> Vos modifications sont gardées dans ce navigateur. Vérifiez votre connexion internet.</p><button class="btn sm" data-act="push">Réessayer</button></div>`;
  if (sync === 'cle') return `<div class="notice bad"><p><strong>Clé refusée.</strong> La ligne CLE du script Google doit être '${esc(CLE)}'.</p><button class="btn sm" data-act="push">Réessayer</button></div>`;
  if (sync === 'script') return `<div class="notice bad"><p><strong>Mettez à jour le script Google.</strong> Rien n’est envoyé pour ne pas mélanger vos voyages ; tout reste gardé dans ce navigateur. Collez le nouveau Code.gs puis Déployer › Gérer les déploiements › Nouvelle version.</p><button class="btn sm" data-act="push">J’ai mis à jour, réessayer</button></div>`;
  return '';
}

function vApercu(c){
  const n = c.kids.length, al = alertsFor(S, c), t = S.trip;
  const ratio = c.accomp.length ? (n / c.accomp.length).toFixed(1).replace('.', ',') : '–';
  const next = S.taches.filter(x => !x.fait).sort((a, b) => (a.echeance || '9').localeCompare(b.echeance || '9')).slice(0, 5);
  const stats = `<div class="stats">
    <div class="stat"><div class="k">Enfants</div><div class="v">${n}</div><div class="d">${c.kids.filter(k => k.autorisation && k.fiche && k.licence).length} dossier(s) complet(s)</div></div>
    <div class="stat"><div class="k">Accompagnateurs</div><div class="v">${c.accomp.length}</div><div class="d">1 adulte pour ${ratio} enfants</div></div>
    <div class="stat"><div class="k">Places voitures</div><div class="v ${c.places < n ? 'bad' : ''}">${c.places}<small> / ${n}</small></div><div class="d">${S.vehicules.length} véhicule(s)</div></div>
    <div class="stat"><div class="k">Places couchage</div><div class="v ${c.lits && c.lits < n + c.accomp.length ? 'bad' : ''}">${c.lits}<small> / ${n + c.accomp.length}</small></div><div class="d">enfants + adultes</div></div>
    <div class="stat"><div class="k">Solde prévu</div><div class="v ${c.solde < 0 ? 'bad' : 'good'}">${eur(c.solde)}</div><div class="d">Encaissé : ${eur(c.encaisse)}</div></div></div>`;
  const row = (pill, lv, b, s, attr) => `<button class="al" ${attr}><span class="pill ${lv}">${pill}</span><span><b>${esc(b)}</b><small>${esc(s)}</small></span><span class="go">→</span></button>`;
  const left = !n && !S.parents.length
    ? `<div class="panel"><h3>Pour commencer</h3><div class="alerts">
        ${row('Étape 1', 'ok', 'Décrivez le voyage', 'Dates, lieu de rendez-vous, participation demandée.', 'data-act="trip"')}
        ${row('Étape 2', 'ok', 'Inscrivez les enfants', 'Collez la liste d’un coup, complétez plus tard.', 'data-tab="enfants"')}
        ${row('Étape 3', 'ok', 'Ajoutez les parents', 'Qui accompagne, qui conduit, combien de places.', 'data-tab="parents"')}
        ${row('Étape 4', 'ok', 'Répartissez voitures et chambres', 'Le carnet signale les enfants sans place.', 'data-tab="transport"')}</div></div>`
    : `<div class="panel"><h3>Points à régler</h3><div class="alerts">${al.length
        ? al.map(([lv, b, s, to]) => row(lv === 'bad' ? 'Urgent' : 'À suivre', lv, b, s, `data-tab="${to}"`)).join('')
        : `<div class="al"><span class="pill ok">OK</span><span><b>Tout est en ordre</b><small>Chaque enfant a une place, ses documents et son paiement.</small></span></div>`}</div></div>`;
  const val = v => v ? esc(v) : '<span class="miss">À renseigner</span>';
  return stats + `<div class="cols">${left}<div class="stack">
    <div class="panel"><h3>Infos pratiques</h3><dl class="info">
      <dt>Rendez-vous</dt><dd>${val(t.rdv)}</dd><dt>Contact d’urgence</dt><dd>${val(t.urgence)}</dd><dt>Participation</dt><dd>${c.part ? eur(c.part) : val('')}</dd></dl>
      ${c.kids.some(k => k.sante) ? `<p class="small" style="margin:14px 0 4px">Santé à connaître</p>${c.kids.filter(k => k.sante).map(k => `<div style="font-size:14px"><strong>${esc(k.prenom)}</strong> : ${esc(k.sante)}</div>`).join('')}` : ''}</div>
    <div class="panel flush"><h3>Prochaines tâches</h3>${next.length
      ? next.map(x => `<div class="task"><input type="checkbox" aria-label="Fait" data-act="toggle" data-col="taches" data-id="${x.id}" data-k="fait"><span class="tt">${esc(x.tache)}</span><span class="small mono ${x.echeance && x.echeance < today() ? 'late' : ''}">${fdate(x.echeance)}</span></div>`).join('')
      : `<p class="sub" style="padding:0 18px 18px">Aucune tâche en attente.</p>`}</div>
  </div></div>`;
}

const tog = (item, col, k, label) => `<button class="tog ${item[k] ? 'on' : 'off'}" data-act="toggle" data-col="${col}" data-id="${item.id}" data-k="${k}">${item[k] ? '✓' : '✗'} ${label}</button>`;

function vEnfants(c){
  const add = `<button class="btn" data-act="bulk">Ajouter une liste</button><button class="btn primary" data-act="add" data-col="enfants">Ajouter un enfant</button>`;
  const head = pageHead('Enfants', `${c.kids.length} inscrit(s) · cliquez sur un nom pour compléter la fiche, sur un document pour le cocher`, add);
  if (!c.kids.length) return head + empty('Aucun enfant inscrit', 'Collez la liste de vos joueurs d’un coup, puis complétez documents, paiement, voiture et chambre au fur et à mesure.', add);
  return head + `<div class="tw"><table><thead><tr><th>Enfant</th><th>Documents</th><th class="num">Payé</th><th>Hébergement</th><th>Transport</th><th>Parent</th></tr></thead><tbody>${c.kids.map(k => {
    const p = num(k.paye), st = !c.part ? '' : p >= c.part ? 'ok' : p > 0 ? 'warn' : 'bad';
    const h = c.heb(k.hebergement), v = c.veh(k.vehicule), pa = c.par(k.parent);
    return `<tr><td><button class="name" data-act="edit" data-col="enfants" data-id="${k.id}">${esc(full(k))}</button>${k.categorie ? `<span class="tag">${esc(k.categorie)}</span>` : ''}${k.sante ? `<div class="small">Santé : ${esc(k.sante.length > 40 ? k.sante.slice(0, 40) + '…' : k.sante)}</div>` : ''}</td>
      <td><div class="chips">${tog(k, 'enfants', 'autorisation', 'Autorisation')}${tog(k, 'enfants', 'fiche', 'Fiche sanitaire')}${tog(k, 'enfants', 'licence', 'Licence')}</div></td>
      <td class="num">${st ? `<span class="pill ${st}">${eur(p)} / ${eur(c.part)}</span>` : eur(p)}</td>
      <td>${h ? esc(h.nom) : '<span class="miss">Non affecté</span>'}</td>
      <td>${v ? esc(v.nom) : '<span class="miss">Non affecté</span>'}</td>
      <td>${pa ? esc(full(pa)) + (pa.telephone ? `<div class="small mono">${esc(pa.telephone)}</div>` : '') : '<span class="small">—</span>'}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

function vParents(c){
  const ps = [...S.parents].sort(byName), add = `<button class="btn primary" data-act="add" data-col="parents">Ajouter un parent</button>`;
  const head = pageHead('Parents et accompagnateurs', `${c.accomp.length} accompagnateur(s) · ${ps.filter(p => p.conduit).length} conducteur(s)`, add);
  if (!ps.length) return head + empty('Aucun parent enregistré', 'Ajoutez les parents pour savoir qui accompagne, qui conduit et combien de places ils offrent.', add);
  return head + `<div class="tw"><table><thead><tr><th>Parent</th><th>Téléphone</th><th>Parent de</th><th>Séjour</th><th>Véhicule</th><th>Hébergement</th></tr></thead><tbody>${ps.map(p => {
    const kids = c.kids.filter(k => k.parent === p.id), car = S.vehicules.find(v => v.conducteur === p.id), h = c.heb(p.hebergement);
    return `<tr><td><button class="name" data-act="edit" data-col="parents" data-id="${p.id}">${esc(full(p))}</button>${p.role ? `<div class="small">${esc(p.role)}</div>` : ''}</td>
      <td class="mono" style="font-size:13px">${esc(p.telephone) || '—'}</td>
      <td>${kids.length ? kids.map(k => esc(k.prenom)).join(', ') : '<span class="small">—</span>'}</td>
      <td>${tog(p, 'parents', 'accompagne', 'Accompagne')}</td>
      <td>${!p.conduit ? '<span class="small">Ne conduit pas</span>' : car ? `${esc(car.nom)}<div class="small">${c.vehOcc(car)} / ${num(car.places)} places</div>` : `<button class="btn sm" data-act="mkveh" data-id="${p.id}">Créer sa voiture (${num(p.places)} pl.)</button>`}</td>
      <td>${!p.accompagne ? '<span class="small">—</span>' : h ? esc(h.nom) : '<span class="miss">Non affecté</span>'}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

function slot(item, col, field, occ, cap, sub, adults = []){
  const kids = S.enfants.filter(k => k[field] === item.id).sort(byName);
  const free = S.enfants.filter(k => !S[col].some(x => x.id === k[field])).sort(byName);
  const over = cap && occ > cap, boxes = Math.max(cap, occ);
  return `<div class="slot ${over ? 'over' : ''}">
    <div class="slot-h"><div style="min-width:0"><h3>${esc(item.nom)}</h3><div class="small">${sub || '&nbsp;'}</div></div><button class="btn sm" data-act="edit" data-col="${col}" data-id="${item.id}">Modifier</button></div>
    <div>${boxes && boxes <= 60 ? `<div class="gauge">${Array.from({length:boxes}, (_, i) => `<i class="${i < occ ? (i >= cap ? 'x' : 'f') : ''}"></i>`).join('')}</div>` : ''}
      <div class="occ">${occ} / ${cap || '?'} places · ${over ? `<span class="late">${occ - cap} de trop</span>` : cap ? `${cap - occ} libre(s)` : 'capacité à renseigner'}</div></div>
    <div class="chips">${kids.map(k => `<span class="kid">${esc(full(k))}<button data-act="unassign" data-id="${k.id}" data-k="${field}" aria-label="Retirer ${esc(full(k))}">×</button></span>`).join('')}${adults.map(p => `<span class="kid adult">${esc(full(p))} · adulte</span>`).join('')}${kids.length || adults.length ? '' : '<span class="small">Personne pour l’instant</span>'}</div>
    ${free.length ? `<select class="assign" data-assign="${field}" data-target="${item.id}" aria-label="Placer un enfant"><option value="">+ Placer un enfant…</option>${free.map(k => `<option value="${k.id}">${esc(full(k))}</option>`).join('')}</select>` : ''}
  </div>`;
}
const unplaced = (list, what) => list.length ? `<div class="notice warn"><p><strong>${list.length} enfant(s) ${what} :</strong> ${list.map(k => esc(full(k))).join(', ')}</p></div>` : '';

function vHeb(c){
  const add = `${S.hebergements.length ? '<button class="btn" data-act="repart" data-what="heb">Copier la répartition</button>' : ''}<button class="btn primary" data-act="add" data-col="hebergements">Ajouter un hébergement</button>`;
  const head = pageHead('Hébergement', `${c.lits} places pour ${c.kids.length} enfants et ${c.accomp.length} adultes · les adultes se placent depuis l’onglet Parents`, add);
  if (!S.hebergements.length) return head + empty('Aucun hébergement', 'Ajoutez l’hôtel ou le centre, ou chaque chambre pour répartir les enfants par chambre.', add);
  return head + unplaced(c.noHeb, 'sans hébergement') + `<div class="grid">${S.hebergements.map(h => slot(h, 'hebergements', 'hebergement', c.hebOcc(h), num(h.capacite),
    [h.type, h.cout ? eur(num(h.cout)) : ''].filter(Boolean).map(esc).join(' · '), S.parents.filter(p => p.hebergement === h.id))).join('')}</div>`;
}
function vTransport(c){
  const dispo = S.parents.filter(p => p.conduit && !S.vehicules.some(v => v.conducteur === p.id));
  const add = `${S.vehicules.length ? '<button class="btn" data-act="repart" data-what="veh">Copier la répartition</button>' : ''}<button class="btn primary" data-act="add" data-col="vehicules">Ajouter un véhicule</button>`;
  const head = pageHead('Transport', `${c.places} places pour ${c.kids.length} enfants`, add);
  const drivers = dispo.length ? `<div class="notice"><p><strong>Conducteurs sans voiture créée :</strong> ${dispo.map(p => `${esc(full(p))} (${num(p.places)} places)`).join(', ')}</p>${dispo.map(p => `<button class="btn sm" data-act="mkveh" data-id="${p.id}">Voiture de ${esc(p.prenom || full(p))}</button>`).join('')}</div>` : '';
  if (!S.vehicules.length) return head + drivers + empty('Aucun véhicule', 'Ajoutez les voitures des parents, le minibus du club ou le car, puis placez chaque enfant.', add);
  return head + drivers + unplaced(c.noVeh, 'sans transport') + `<div class="grid">${S.vehicules.map(v => { const d = c.par(v.conducteur);
    return slot(v, 'vehicules', 'vehicule', c.vehOcc(v), num(v.places), [v.type, d && 'Conduit par ' + full(d), v.rdv].filter(Boolean).map(esc).join(' · ')); }).join('')}</div>`;
}

function vBudget(c){
  const cats = {};
  if (c.depHeb) cats['Hébergement'] = c.depHeb;
  if (c.depVeh) cats['Transport'] = c.depVeh;
  c.dep.forEach(b => { const k = b.categorie || 'Divers'; cats[k] = (cats[k] || 0) + num(b.montant); });
  const entries = Object.entries(cats).sort((a, b) => b[1] - a[1]), max = Math.max(1, ...entries.map(e => e[1]));
  const lines = [...S.budget].sort((a, b) => (a.sens || '').localeCompare(b.sens || '') || (a.categorie || '').localeCompare(b.categorie || ''));
  const auto = (label, cat, amount, state) => `<tr><td class="auto">${esc(label)}</td><td>${cat}</td><td class="num mono">${amount}</td><td>${state}</td></tr>`;
  const rows = [
    ...S.hebergements.filter(h => num(h.cout)).map(h => auto(h.nom, 'Hébergement', '−' + eur(num(h.cout)), '<span class="small">auto</span>')),
    ...S.vehicules.filter(v => num(v.cout)).map(v => auto(v.nom, 'Transport', '−' + eur(num(v.cout)), '<span class="small">auto</span>')),
    ...(c.attendu ? [auto(`Participations (${c.kids.length} × ${eur(c.part)})`, 'Recette', '+' + eur(c.attendu), `<span class="pill ${c.encaisse >= c.attendu ? 'ok' : 'warn'}">${eur(c.encaisse)} reçus</span>`)] : []),
    ...lines.map(b => `<tr><td><button class="name" data-act="edit" data-col="budget" data-id="${b.id}">${esc(b.libelle)}</button></td><td>${esc(b.categorie || '—')}</td><td class="num mono">${b.sens === 'Recette' ? '+' : '−'}${eur(num(b.montant))}</td><td>${tog(b, 'budget', 'regle', b.sens === 'Recette' ? 'Encaissé' : 'Réglé')}</td></tr>`)
  ];
  return pageHead('Budget', 'Les coûts d’hébergement et de transport sont repris automatiquement', `<button class="btn primary" data-act="add" data-col="budget">Ajouter une ligne</button>`) + `<div class="stats">
    <div class="stat"><div class="k">Dépenses</div><div class="v">${eur(c.depenses)}</div><div class="d">${c.kids.length ? eur(c.depenses / c.kids.length) + ' par enfant' : '—'}</div></div>
    <div class="stat"><div class="k">Recettes</div><div class="v">${eur(c.recettes)}</div><div class="d">dont familles ${eur(c.attendu)}</div></div>
    <div class="stat"><div class="k">Solde prévu</div><div class="v ${c.solde < 0 ? 'bad' : 'good'}">${eur(c.solde)}</div><div class="d">${c.solde < 0 && c.kids.length ? `+${eur(Math.ceil(-c.solde / c.kids.length))} par enfant pour équilibrer` : 'recettes − dépenses'}</div></div>
    <div class="stat"><div class="k">Encaissé familles</div><div class="v">${eur(c.encaisse)}</div><div class="d">sur ${eur(c.attendu)} attendus</div></div></div>
  <div class="cols"><div class="panel flush">${rows.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Libellé</th><th>Catégorie</th><th class="num">Montant</th><th>État</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<p class="sub" style="padding:18px">Aucune ligne : ajoutez l’inscription au tournoi, les repas, les subventions ou les sponsors.</p>`}</div>
  <div class="panel"><h3>Où va l’argent</h3>${entries.length ? entries.map(([k, v]) => `<div class="cat"><span>${esc(k)}</span><span class="b"><i style="width:${v / max * 100}%"></i></span><span class="num mono">${eur(v)}</span></div>`).join('') : '<p class="sub">Aucune dépense saisie.</p>'}
    <p class="sub" style="margin-top:14px">Participation par enfant : ${c.part ? eur(c.part) : 'non fixée'} · <button class="btn sm" data-act="trip">Modifier</button></p></div></div>`;
}

function vTaches(){
  const ts = [...S.taches].sort((a, b) => a.fait - b.fait || (a.echeance || '9').localeCompare(b.echeance || '9'));
  const add = `<button class="btn" data-act="tpl">Ajouter la liste type</button><button class="btn primary" data-act="add" data-col="taches">Ajouter une tâche</button>`;
  const head = pageHead('À faire', `${ts.filter(t => t.fait).length} / ${ts.length} terminée(s)`, add);
  if (!ts.length) return head + empty('Aucune tâche', 'La liste type ajoute les 15 étapes habituelles d’un déplacement : autorisations, assurance, trousse de secours…', add);
  return head + `<div class="panel flush">${ts.map(x => `<div class="task ${x.fait ? 'done' : ''}"><input type="checkbox" aria-label="Fait" ${x.fait ? 'checked' : ''} data-act="toggle" data-col="taches" data-id="${x.id}" data-k="fait">
    <span class="tt"><button class="name" style="font-weight:500" data-act="edit" data-col="taches" data-id="${x.id}">${esc(x.tache)}</button>${x.responsable ? `<span class="small"> · ${esc(x.responsable)}</span>` : ''}</span>
    <span class="small mono ${!x.fait && x.echeance && x.echeance < today() ? 'late' : ''}">${fdate(x.echeance)}</span></div>`).join('')}</div>`;
}

/* ===== Actions ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tab],[data-act],[data-close],[data-trip]');
  if (!b) { if (e.target.id === 'ov') closeForm(); return; }
  if (b.hasAttribute('data-close')) return closeForm();
  if (b.dataset.trip) return setTrip(b.dataset.trip);
  if (b.dataset.tab) { closeForm(); return go(b.dataset.tab); }
  const {act, col, id, k} = b.dataset;
  const actions = {
    trip: () => openForm('trip'),
    add: () => openForm(col),
    edit: () => { const it = find(col, id); if (it) openForm(col, it); },
    toggle: () => { const it = find(col, id); if (it) patch(col, it, {[k]: !it[k]}); },
    unassign: () => { const it = find('enfants', id); if (it) patch('enfants', it, {[k]: ''}); },
    mkveh: () => { const p = find('parents', id); if (p) put('vehicules', null, {nom:'Voiture de ' + full(p), type:'Voiture de parent', conducteur:p.id, places:num(p.places), cout:'', rdv:'', notes:''}); },
    tpl: () => { const have = new Set(S.taches.map(t => t.tache)); TEMPLATE.filter(t => !have.has(t)).forEach(t => S.taches.push({id:newId(), tache:t, echeance:'', responsable:'', fait:false})); changed(); toast('Liste type ajoutée.'); },
    bulk: openBulk, newtrip: openNewTrip, lien: openLien, save: openSave, export: exportFile,
    repart: () => repartition(b.dataset.what),
    copy: () => copyOut(b.dataset.txt, 'Copié : collez-le dans le groupe des parents.'),
    mklien: () => { S.trip = {...S.trip, lien:jeton()}; changed(); openLien(); },
    rmlien: () => {
      if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Confirmer : l’ancien lien ne marchera plus'; return; }
      S.trip = {...S.trip, lien:''}; closeForm(); changed(); toast('Lien parents désactivé.');
    },
    push: () => { closeForm(); push(); },
    pull: () => {
      if (dirty && !b.dataset.armed) { b.dataset.armed = 1; b.classList.add('danger'); b.textContent = 'Confirmer : écraser les modifications non envoyées'; return; }
      closeForm(); pull();
    }
  };
  if (actions[act]) actions[act]();
});
document.addEventListener('change', e => {
  const s = e.target.closest('select.assign');
  if (s && s.value) { const it = find('enfants', s.value); if (it) patch('enfants', it, {[s.dataset.assign]: s.dataset.target}); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ov').hidden) closeForm(); });
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ===== Démarrage ===== */
draw();
if (dirty) push(); else pull();
</script>
</body>
</html>
